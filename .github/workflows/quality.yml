name: Quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/advanced-tool-experience]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Astro diagnostics
        run: npm run check
      - name: Production build
        run: npm run build
