name: Quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/advanced-tool-experience]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Astro diagnostics
        id: diagnostics
        continue-on-error: true
        run: npm run check
      - name: Production build
        id: production
        continue-on-error: true
        run: npm run build
      - name: Report validation to PR
        if: always() && github.ref == 'refs/heads/feature/advanced-tool-experience'
        uses: actions/github-script@v7
        with:
          script: |
            const diagnostics = '${{ steps.diagnostics.outcome }}';
            const production = '${{ steps.production.outcome }}';
            const sha = context.sha.slice(0, 12);
            const body = `<!-- calcwise-quality-report -->\n## Automated branch validation\n\nCommit: \`${sha}\`\n- Astro diagnostics: **${diagnostics}**\n- Production build: **${production}**\n- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const comments = await github.paginate(github.rest.issues.listComments, {owner: context.repo.owner, repo: context.repo.repo, issue_number: 1, per_page: 100});
            const previous = comments.find(comment => comment.body?.includes('<!-- calcwise-quality-report -->'));
            if (previous) await github.rest.issues.updateComment({owner: context.repo.owner, repo: context.repo.repo, comment_id: previous.id, body});
            else await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: 1, body});
      - name: Enforce successful validation
        if: steps.diagnostics.outcome != 'success' || steps.production.outcome != 'success'
        run: exit 1
